schema_version: 1

project:
  name: zno-existing-results-datasets
  description: Dataset generation from the preserved ZnO simulation results.

input:
  # Relative input paths are resolved below results_dir.
  results_dir: results
  tddft_summary: tddft_summary.csv
  tddft_directory: tddft
  ranking: zno_solution_ranked.csv

output:
  # Every execution receives a new directory below this path.
  root: data/generated

execution:
  environment: qml-zno-modeling

methods:
  tddft:
    mode: both

  multitech:
    targets:
      - summary
      - expanded
      - md_windows
    md_windows_per_site: 10

  qml_features:
    # The preserved ranking predates the material column and contains only ZnO.
    default_material: ZnO
